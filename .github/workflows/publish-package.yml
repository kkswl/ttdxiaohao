name: Publish plugin package

on:
  push:
    branches: [main]
    paths:
      - "plugin.json"
      - "plugin.py"
      - "account_manager/**"
      - "docs/**"
      - "tools/**"
      - "tests/**"
      - "README.md"
      - "requirements-dev.txt"
      - "package/**"
      - ".github/workflows/publish-package.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-package-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("plugin.json", encoding="utf-8") as manifest:
              version = json.load(manifest)["version"]
          print(f"value={version}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare package metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: package/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}

      - name: Write package summary
        run: |
          echo "### Plugin package published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.version.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`ghcr.io/${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
